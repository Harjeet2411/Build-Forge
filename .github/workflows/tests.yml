name: tests
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Service tests
        run: python3 -m unittest discover -s tests
        working-directory: agent
      - name: Runner and MCP server tests
        run: python3 -m unittest discover -s tests
        working-directory: kiro-runner
